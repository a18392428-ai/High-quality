<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحسّن جودة الصور والفيديوهات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🎬✨ مُحسّن الجودة الذكي</h1>
            <p>اختر الدقة المطلوبة وحسّن ألوان وتفاصيل ملفاتك مجاناً</p>
        </header>

        <!-- منطقة رفع الملفات -->
        <div class="upload-section">
            <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
            <button type="button" class="btn-upload" onclick="document.getElementById('mediaInput').click()">
                📂 اختر صورة أو فيديو
            </button>
            <span class="upload-hint">يدعم جميع صيغ الصور والفيديوهات</span>
        </div>

        <!-- منطقة المعالجة والتحكم -->
        <div class="editor-section" id="editorSection" style="display: none;">
            
            <div class="controls-card">
                <h3>🎛️ إعدادات الجودة والتحسين</h3>
                
                <!-- قائمة اختيار الجودة -->
                <div class="control-group">
                    <label>🎯 اختر دقة العرض (Resolution):</label>
                    <select id="qualitySelect" class="quality-dropdown">
                        <option value="144">144p (منخفضة جداً)</option>
                        <option value="360">360p (عادية)</option>
                        <option value="480">480p (متوسطة SD)</option>
                        <option value="1080" selected>1080p (عالية Full HD)</option>
                        <option value="1440">1440p (فائقة 2K)</option>
                        <option value="2160">2160p (أعلى جودة 4K)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>🔍 حدة التفاصيل (Sharpness): <span id="sharpVal">60%</span></label>
                    <input type="range" id="sharpness" min="0" max="100" value="60">
                </div>

                <div class="control-group">
                    <label>🌗 التباين (Contrast): <span id="contrastVal">120%</span></label>
                    <input type="range" id="contrast" min="80" max="200" value="120">
                </div>

                <div class="control-group">
                    <label>☀️ السطوع (Brightness): <span id="brightVal">105%</span></label>
                    <input type="range" id="brightness" min="80" max="150" value="105">
                </div>

                <div class="control-group">
                    <label>🎨 تشبع الألوان (Saturation): <span id="saturateVal">125%</span></label>
                    <input type="range" id="saturation" min="80" max="200" value="125">
                </div>

                <div class="btn-group">
                    <button type="button" id="resetBtn" class="btn-secondary">🔄 إعادة ضبط</button>
                    <button type="button" id="downloadBtn" class="btn-primary">💾 حفظ بالدقة المختارة</button>
                </div>
            </div>

            <!-- المعاينة -->
            <div class="preview-card">
                <canvas id="canvasPreview"></canvas>
                <video id="videoElement" playsinline muted style="display: none;"></video>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
