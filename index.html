<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحسّن جودة الصور والفيديوهات HD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🎬✨ مُحسّن الوسائط الشامل (صور وفيديوهات)</h1>
            <p>ارفع صورتك أو فيديوك وحسّن جودته وألوانه مباشرة مجاناً</p>
        </header>

        <!-- منطقة رفع الملفات -->
        <div class="upload-section" id="dropArea">
            <input type="file" id="mediaInput" accept="image/*,video/*" hidden>
            <button type="button" class="btn-upload" onclick="document.getElementById('mediaInput').click()">
                📂 اختر صورة أو فيديو من جهازك
            </button>
            <span class="upload-hint">يدعم صور (JPG, PNG) وفيديوهات (MP4, WebM)</span>
        </div>

        <!-- منطقة التعديل والمعاينة -->
        <div class="editor-section" id="editorSection" style="display: none;">
            
            <!-- لوحة التحكم -->
            <div class="controls-card">
                <h3>🎛️ أدوات تحسين الجودة</h3>
                
                <div class="control-group" id="sharpnessGroup">
                    <label>الحدة والوضوح (Sharpness): <span id="sharpVal">50%</span></label>
                    <input type="range" id="sharpness" min="0" max="100" value="50">
                </div>

                <div class="control-group">
                    <label>التباين (Contrast): <span id="contrastVal">110%</span></label>
                    <input type="range" id="contrast" min="80" max="200" value="110">
                </div>

                <div class="control-group">
                    <label>سطوع الألوان (Brightness): <span id="brightVal">105%</span></label>
                    <input type="range" id="brightness" min="80" max="150" value="105">
                </div>

                <div class="control-group">
                    <label>تشبع الألوان (Saturation): <span id="saturateVal">120%</span></label>
                    <input type="range" id="saturation" min="80" max="200" value="120">
                </div>

                <div class="btn-group">
                    <button type="button" id="resetBtn" class="btn-secondary">🔄 إعادة ضبط</button>
                    <button type="button" id="downloadBtn" class="btn-primary">💾 تحميل الملف المحسّن</button>
                </div>
            </div>

            <!-- عرض المعاينة (صورة أو فيديو مخفي للعرض على Canvas) -->
            <div class="preview-card">
                <canvas id="canvasPreview"></canvas>
                <video id="videoElement" crossorigin="anonymous" playsinline muted style="display: none;"></video>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
